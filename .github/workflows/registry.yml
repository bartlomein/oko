name: Publish to the MCP Registry

# Lists each published release in the official MCP Registry
# (registry.modelcontextprotocol.io) through its MCP Bundle. GitHub's OIDC token
# proves the io.github.bartlomein namespace; no secret is stored.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to list, for example v0.9.1
        required: true

permissions:
  contents: read

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fill server.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS
          python3 - <<'PY'
          import json, os
          tag = os.environ['TAG']
          version = tag.removeprefix('v')
          name = f'oko-{tag}-macos.mcpb'
          sums = dict(reversed(line.split()) for line in open('SHA256SUMS') if line.strip())
          server = json.load(open('server.json'))
          server['version'] = version
          package = server['packages'][0]
          package['identifier'] = f'https://github.com/bartlomein/oko/releases/download/{tag}/{name}'
          package['fileSha256'] = sums[name]
          json.dump(server, open('server.json', 'w'), indent=2)
          print(json.dumps(server, indent=2))
          PY
      - name: Check the bundle matches
        run: |
          url=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['identifier'])")
          curl -fsSL "$url" -o bundle.mcpb
          echo "$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['fileSha256'])")  bundle.mcpb" | sha256sum --check
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" -o publisher.tar.gz
          echo "$PUBLISHER_SHA256  publisher.tar.gz" | sha256sum --check
          tar -xzf publisher.tar.gz mcp-publisher
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
