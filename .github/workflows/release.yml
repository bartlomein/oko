name: Draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml
  bundle:
    # The MCP Bundle the official MCP Registry lists: one universal macOS binary.
    needs: checks
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: oko-*-apple-darwin
          path: archives
          merge-multiple: true
      - name: Build and check the bundle
        run: |
          python3 scripts/mcpb.py --arm archives/*-aarch64-apple-darwin.tar.gz \
            --intel archives/*-x86_64-apple-darwin.tar.gz --output bundle
          cd bundle
          shasum -a 256 --check ./*.mcpb.sha256
          mkdir unpacked && unzip -q ./*.mcpb -d unpacked
          lipo unpacked/server/oko -verify_arch arm64 x86_64
          unpacked/server/oko --version
          python3 -c "import json; m = json.load(open('unpacked/manifest.json')); assert m['version'] in '$GITHUB_REF_NAME'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oko-mcpb
          path: |
            bundle/*.mcpb
            bundle/*.mcpb.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  draft:
    needs: [checks, bundle]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: oko-*
          path: release-assets
          merge-multiple: true
      - name: Verify assets and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release-assets
        run: |
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.mcpb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 5
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz ./*.mcpb SHA256SUMS \
            --verify-tag --draft --prerelease --generate-notes --title "Oko $GITHUB_REF_NAME"
