name: Build and verify packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      # CI must never use a saved OS credential or a real provider.
      TYPESAFE_API_KEY: ""
      TYPESAFE_BASE_URL: http://127.0.0.1:1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test installer offline
        run: |
          sh -n install.sh
          python3 scripts/test-install.py
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release.py check-tag "$GITHUB_REF_NAME"
      - name: Install checksum-pinned ripgrep
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/release.py ripgrep --target "$TARGET" --output "$RUNNER_TEMP/oko-tools"
          echo "$RUNNER_TEMP/oko-tools" >> "$GITHUB_PATH"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run offline-provider tests
        run: cargo test --locked
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET" --bin oko
      - name: Package and test downloaded layout
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python3 scripts/release.py package --target "$TARGET" --output target/release-bundles
          python3 scripts/smoke-release.py target/release-bundles/*.tar.gz
          for archive in target/release-bundles/*.tar.gz; do
            OKO_TEST_ARCHIVE="$archive" python3 scripts/test-install.py InstallerTests.test_native_archive
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oko-${{ matrix.target }}
          path: target/release-bundles/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
