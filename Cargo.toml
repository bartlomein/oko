[package]
name = "oko"
version = "0.2.1"
edition = "2024"
description = "A small search and ranking CLI and Rust library with TypeSafe AI Jev reranking"
default-run = "oko"
license = "MIT"
repository = "https://github.com/bartlomein/oko"
readme = "README.md"
include = ["src/**/*.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "benchmarks/*.json", "examples/*.json"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
keyring = "4.2"
libc = "0.2"
notify = "8.2"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io", "client"] }
rpassword = "7.5"
schemars = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "sync", "process", "time"] }
toml_edit = "0.25"
tree-sitter = "0.25.10"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23.2"
zeroize = "1.8"

[[bin]]
name = "oko"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
